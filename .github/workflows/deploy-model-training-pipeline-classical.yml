name: deploy-model-training-pipeline

on: 
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  
jobs:
  get-config:
      uses: Azure/mlops-templates/.github/workflows/read-yaml.yml@main
      with:
        file_name: config-infra-prod.yml
  register-environment:
      needs: get-config
      uses: Azure/mlops-templates/.github/workflows/register-environment.yml@main
      with:
        resource_group: ${{ needs.get-config.outputs.resource_group }}
        workspace_name: ${{ needs.get-config.outputs.aml_workspace }}     
        environment_file:  mlops/azureml/train/train-env.yml
        conda_file: data-science/environment/train-conda.yml
      secrets:
          AZURE_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
           
  register-dataset:
    needs: get-config
    uses: Azure/mlops-templates/.github/workflows/register-dataset.yml@main
    with:
      resource_group: ${{ needs.get-config.outputs.resource_group }}
      workspace_name: ${{ needs.get-config.outputs.aml_workspace }}
      name: taxi-data
      data_file: mlops/azureml/train/data.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
       
  create-compute:
      needs: [get-config,register-environment,register-dataset]
      runs-on: ubuntu-latest
      env:
        RESOURCE_GROUP: ${{ needs.get-config.outputs.resource_group }}
        WORKSPACE_NAME: ${{ needs.get-config.outputs.aml_workspace }}
      steps:
        - name: Log in to Azure
          uses: azure/login@v2
          with:
            client-id: ${{ secrets.ARM_CLIENT_ID }}
            tenant-id: ${{ secrets.ARM_TENANT_ID }}
            subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
        - name: Ensure Azure ML compute exists
          run: |
            az extension add --name ml --upgrade

            if ! az ml compute show \
              --name cpu-cluster \
              --resource-group "$RESOURCE_GROUP" \
              --workspace-name "$WORKSPACE_NAME" \
              --only-show-errors >/dev/null 2>&1; then
              az ml compute create \
                --name cpu-cluster \
                --size Standard_DS3_v2 \
                --min-instances 0 \
                --max-instances 4 \
                --type AmlCompute \
                --tier low_priority \
                --resource-group "$RESOURCE_GROUP" \
                --workspace-name "$WORKSPACE_NAME"
            else
              echo "Compute cluster 'cpu-cluster' already exists. Skipping creation."
            fi
       
  run-pipeline:
      needs: [get-config,register-environment,create-compute,register-dataset]
      uses: Azure/mlops-templates/.github/workflows/run-pipeline.yml@main
      with:
        resource_group: ${{ needs.get-config.outputs.resource_group }}
        workspace_name: ${{ needs.get-config.outputs.aml_workspace }}     
        parameters-file:  mlops/azureml/train/pipeline.yml
        job-name: test
      secrets:
          AZURE_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
